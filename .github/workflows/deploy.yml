name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Todos los días a las 06:17 UTC, para recoger cambios de Supabase.
    - cron: '17 6 * * *'
  repository_dispatch:
    # Webhook de Supabase al publicar o cambiar un veredicto (etapa 2).
    types: [supabase-publicado]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      # Variables del repositorio (Settings → Secrets and variables → Actions → Variables).
      # La clave anon es pública por diseño; la service_role nunca se usa aquí.
      DATOS_FUENTE: ${{ vars.DATOS_FUENTE || 'ejemplo' }}
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      SITIO_URL: ${{ vars.SITIO_URL || 'https://sebastianignacioromero-byte.github.io' }}
      SITIO_BASE: ${{ vars.SITIO_BASE || '/PILDORAS' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
